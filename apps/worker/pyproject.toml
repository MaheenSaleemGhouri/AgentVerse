[project]
name = "agentverse-worker"
version = "0.1.0a0"
description = "AgentVerse agent-runtime background worker fleet."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<6",
    "agentverse-shared",
    "openai-agents>=0.18.3",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "asyncpg>=0.31,<0.32",
    "openai>=2.45,<3",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "pgvector>=0.4,<0.5",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<0.10",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.26",
    "httpx>=0.28,<0.29",
    "fakeredis>=2.26,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentverse_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agentverse_worker"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires `Depends(...)` as an
# argument default — that's the framework's documented usage, not the
# mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# pgvector ships no py.typed marker (upstream gap). Scoped to this one
# third-party module rather than inline ignores at each import site, so
# the untyped surface stays visible in config. Mirrors apps/api.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real Postgres with pgvector (AGENTVERSE_WORKER_DATABASE_URL) or a real Redis (AGENTVERSE_WORKER_REDIS_URL) — CLAUDE.md §11, never mocked",
]

[tool.uv.sources]
agentverse-shared = { path = "../../packages/python-shared", editable = true }
