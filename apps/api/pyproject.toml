[project]
name = "agentverse-api"
version = "0.1.0a0"
description = "AgentVerse orchestration/control-plane API gateway."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.18,<2",
    "pyjwt[crypto]>=2.13,<3",
    "openai>=1.59,<2",
    "redis>=5.2,<6",
    "pgvector>=0.4,<0.5",
    # Required by the knowledge-base upload route: FastAPI raises at
    # import time on a multipart endpoint without it, so this is a hard
    # runtime dependency, not a test-only one.
    "python-multipart>=0.0.20,<0.1",
    "agentverse-shared",
    "stripe>=12,<13",
    "anthropic>=0.40,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<0.10",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.26",
    "httpx>=0.28,<0.29",
    "fakeredis>=2.26,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentverse_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agentverse_api"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires `Depends(...)` as an
# argument default — that's the framework's documented usage, not the
# mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# Alembic-generated migrations: machine-generated, reviewed for
# correctness (not hand-formatted), regenerating on every schema change
# — holding them to line-length/import-sort style is churn without value.
"src/agentverse_api/infrastructure/migrations/versions/*.py" = ["E501", "I001", "UP007", "UP035"]
# SCIM 2.0 wire schemas: RFC 7643/7644 fixes these attribute names as
# camelCase (`userName`, `displayName`, `totalResults`). Identity
# providers validate against them literally, so snake_case here would
# not be a style improvement — it would be a non-conforming API.
# Scoped to this one file so the naming rule stays enforced everywhere else.
"src/agentverse_api/auth_service/interface/schemas/scim.py" = ["N815"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# pgvector ships no py.typed marker (upstream gap, not our choice).
# Scoped to this one third-party module rather than silenced with inline
# ignores at each import site, so the untyped surface stays visible in
# config instead of scattered through code.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real Postgres (DATABASE_URL) — CLAUDE.md §11, never mocked",
]

[tool.uv.sources]
agentverse-shared = { path = "../../packages/python-shared", editable = true }
