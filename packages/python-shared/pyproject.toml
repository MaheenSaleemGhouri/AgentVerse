[project]
name = "agentverse-shared"
version = "0.1.0a0"
description = "Genuinely shared, service-agnostic utilities used by more than one AgentVerse Python service — never a dumping ground for one service's business logic (CLAUDE.md §7: shared libraries)."
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2,<6",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<0.10",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.26",
    "fakeredis>=2.26,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentverse_shared"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agentverse_shared"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
