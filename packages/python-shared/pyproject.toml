[project]
name = "agentverse-shared"
version = "0.1.0a0"
description = "Genuinely shared, service-agnostic utilities used by more than one AgentVerse Python service — never a dumping ground for one service's business logic (CLAUDE.md §7: shared libraries)."
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2,<6",
    # Real tokenizer, needed identically by apps/worker (chunk sizing at
    # ingestion) and apps/api (context-budget assembly at retrieval) —
    # `rag-expert` forbids character-count approximation for budgeting.
    "tiktoken>=0.13,<0.14",
    # The shared embedding provider is the single adapter both services
    # call (CLAUDE.md Rule 16); it is the only file here importing openai.
    #
    # Deliberately spans both majors: apps/api pins <2 (its Phase 2 chat
    # adapter is tested against 1.x) while apps/worker pins >=2.45 (the
    # Agents SDK requires it). A narrower range here would make one of the
    # two services unresolvable. Only `embeddings.create` and the exception
    # types are used, and both are API-stable across 1.x/2.x. Converging
    # the two services onto one major is tracked separately — it is an
    # apps/api adapter-retest task, not a Phase 5 change.
    "openai>=1.59,<3",
    # The `kb_chunks` similarity/FTS SQL is shared for the same reason the
    # pipeline above it is: apps/api's search endpoint and apps/worker's
    # run grounding must query identically, or the search UI would show a
    # user results their agent never sees. Core only — no ORM models, no
    # metadata ownership; the schema stays owned by apps/api's Alembic
    # migrations (CLAUDE.md §8).
    "sqlalchemy[asyncio]>=2.0.51,<3",
    # Envelope encryption for third-party MCP credentials (Phase 6).
    # Shared because apps/api writes credentials and apps/worker resolves
    # them at tool-call time — two implementations of the same envelope
    # format is exactly the drift that makes ciphertext unreadable by the
    # service that did not write it. AESGCM only; no custom crypto
    # (CLAUDE.md §10).
    # >=48.0.1 for GHSA-537c-gmf6-5ccf. This is the library that seals
    # every MCP credential (security/envelope.py), so it is not a
    # dependency to leave on a vulnerable version.
    "cryptography>=48.0.1,<49",
    # RED/USE metrics for the tool-execution boundary. Shared because the
    # egress guard and the credential envelope live here and are called
    # from both services, so the metric names must be defined once
    # (Rule 3). The boring choice deliberately (CLAUDE.md §3, KISS):
    # a scrape endpoint and a text format, no agent, no push gateway.
    "prometheus-client>=0.21,<1",
    # S3-compatible client for `storage.document_store.S3DocumentStore`
    # (Neon Object Storage in production — apps/api and apps/worker are
    # separate containers with no shared filesystem, so uploaded
    # knowledge-base documents need a network-reachable store both can
    # address). Sync SDK, offloaded via `asyncio.to_thread` like every
    # other blocking call in this module (CLAUDE.md Rule 12).
    "boto3>=1.35,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<0.10",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.26",
    "fakeredis>=2.26,<3",
    "asyncpg>=0.31,<0.32",
    # Type stubs only — `boto3` itself ships no `py.typed` marker, so
    # `mypy --strict` on `storage/document_store.py` needs these to
    # resolve `S3Client`/`Config` instead of failing on `import-untyped`.
    "boto3-stubs[s3]>=1.35,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentverse_shared"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agentverse_shared"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real Postgres with pgvector (AGENTVERSE_SHARED_DATABASE_URL) — CLAUDE.md §11, never mocked",
]
