name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly dependency-vulnerability sweep (CLAUDE.md §10: dependency
    # security checks run on every PR touching manifests *and* nightly).
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "9.15.9"
  NODE_VERSION: "22.23.1"
  UV_VERSION: "0.11.32"

jobs:
  # Cheapest-first ordering (CLAUDE.md §11): lint/type-check before test,
  # node and python tracks run in parallel since neither depends on the
  # other's output. python-checks now includes real-Postgres integration
  # tests (Phase 1) via the `postgres` service container below — CLAUDE.md
  # §11: "an integration test that mocks the database gives false
  # confidence."
  node-checks:
    name: node / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ["@agentverse/contracts", "@agentverse/web"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '${{ matrix.package }}' run lint
      - run: pnpm --filter '${{ matrix.package }}' run typecheck
      - if: matrix.package == '@agentverse/web'
        run: pnpm --filter '@agentverse/web' run test
      - run: pnpm --filter '${{ matrix.package }}' run build

  python-checks:
    name: python / ${{ matrix.path }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [apps/api, apps/worker, packages/python-shared]
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    # Every leg gets its own pgvector container. The schema is owned by
    # apps/api's Alembic migrations, so each leg applies them from there
    # before running — without that, apps/worker's and python-shared's
    # integration tests skip against an empty database and the
    # cross-tenant isolation coverage silently does not run.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentverse
          POSTGRES_PASSWORD: agentverse_ci_only
          POSTGRES_DB: agentverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentverse -d agentverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The boundary's circuit breaker, per-run budget, and result cache
      # are all Redis-backed, so the concurrency measurement in
      # tests/tools/test_boundary_load.py needs a real one — fakeredis is
      # in-process and would report latency unrelated to a deployed
      # system. Without this service the measurement skips, and a
      # performance gate that skips is not a gate.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTVERSE_WORKER_REDIS_URL: redis://localhost:6379/0
      AGENTVERSE_API_DATABASE_URL: postgresql+asyncpg://agentverse:agentverse_ci_only@localhost:5432/agentverse
      # Set for every leg so the integration suites actually execute
      # rather than deselecting themselves. Their conftests skip when the
      # variable is unset, which reads as green — the failure mode this
      # exists to prevent.
      AGENTVERSE_WORKER_DATABASE_URL: postgresql+asyncpg://agentverse:agentverse_ci_only@localhost:5432/agentverse
      AGENTVERSE_SHARED_DATABASE_URL: postgresql+asyncpg://agentverse:agentverse_ci_only@localhost:5432/agentverse
      # Both point at the same runner-local nothing-is-listening address —
      # fine for ruff/mypy/unit tests (nothing calls out) and for the
      # integration suite (get_current_identity is dependency-overridden,
      # never exercising a real JWKS fetch; see tests/auth_service/integration/test_rbac_routes.py).
      AGENTVERSE_API_AUTH_INTERNAL_URL: http://localhost:3000
      AGENTVERSE_API_AUTH_PUBLIC_URL: http://localhost:3000
      # The OAuth callback origin. Required with no default since the MCP
      # OAuth2 work, but never added here — `agentverse_api.main` builds
      # `Settings()` at import time, so `tests/conftest.py` could not even
      # be collected without it and this job has been failing at the
      # pytest step, not merely skipping tests. Added with the same
      # runner-local placeholder as the two URLs above: nothing in the
      # suite performs a redirect against it.
      AGENTVERSE_API_API_PUBLIC_URL: http://localhost:8000
      AGENTVERSE_API_INTERNAL_API_SECRET: ci-only-secret-not-for-production
      # Never a real key: unit tests inject a fake ProviderAdapter/embedder
      # and never construct a real AsyncOpenAI client, so this only needs
      # to satisfy Settings' "no default" requirement, not authenticate.
      AGENTVERSE_API_OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
      AGENTVERSE_WORKER_OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.path }}/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Apply schema migrations (owned by apps/api)
        working-directory: apps/api
        run: uv sync --frozen && uv run alembic upgrade head
      - run: uv run pytest -q

  # Rule 19 says migrations are reversible. Until now that was verified
  # by hand before each merge, which means it was verified as carefully
  # as whoever remembered to do it — and a `downgrade()` nobody runs is
  # a function that has never been executed, in the one place where "we
  # can roll back" is the whole safety story.
  #
  # `upgrade head` -> `downgrade base` -> `upgrade head` exercises every
  # migration's downgrade in order, not just the newest one. That
  # matters because a downgrade only has to work from the state the one
  # above it leaves behind, and testing the top migration alone would
  # never catch an older one that stopped composing.
  migration-reversibility:
    name: migration reversibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentverse
          POSTGRES_PASSWORD: agentverse_ci_only
          POSTGRES_DB: agentverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentverse -d agentverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTVERSE_API_DATABASE_URL: postgresql+asyncpg://agentverse:agentverse_ci_only@localhost:5432/agentverse
      AGENTVERSE_API_AUTH_INTERNAL_URL: http://localhost:3000
      AGENTVERSE_API_AUTH_PUBLIC_URL: http://localhost:3000
      AGENTVERSE_API_API_PUBLIC_URL: http://localhost:8000
      AGENTVERSE_API_INTERNAL_API_SECRET: ci-only-secret-not-for-production
      AGENTVERSE_API_OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - name: Apply every migration
        run: uv run alembic upgrade head
      - name: Roll every migration back
        run: uv run alembic downgrade base
      - name: Confirm the schema is actually gone
        # A `downgrade()` that returns without dropping its table leaves
        # the next `upgrade` to fail on an existing object — or worse,
        # to succeed against a table it did not create. Asserting the
        # database is empty is what makes the round trip meaningful.
        run: |
          REMAINING=$(uv run python -c "
          import asyncio, os
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text

          async def main():
              engine = create_async_engine(os.environ['AGENTVERSE_API_DATABASE_URL'])
              async with engine.connect() as conn:
                  result = await conn.execute(text(
                      \"SELECT count(*) FROM information_schema.tables \"
                      \"WHERE table_schema = 'public' AND table_name <> 'alembic_version'\"
                  ))
                  print(result.scalar_one())
              await engine.dispose()

          asyncio.run(main())
          ")
          echo "Tables remaining after full downgrade: $REMAINING"
          if [ "$REMAINING" -ne 0 ]; then
            echo "::error::$REMAINING table(s) survived a full downgrade — a migration's downgrade() is incomplete."
            exit 1
          fi
      - name: Re-apply every migration
        # The second upgrade is the real assertion: it proves the
        # downgrades left the database in a state the migrations can
        # build on again, which is what a rollback actually needs.
        run: uv run alembic upgrade head

  # Builds the images CI has never built. Added after both service
  # Dockerfiles were found to be unbuildable — they copied only their own
  # service directory while both pyproject.toml files resolve
  # `agentverse-shared` by relative path, so `uv sync` failed inside every
  # image. That went unnoticed from Phase 5 to Phase 6 because every
  # green pipeline and every local stack ran the services with `uv run`
  # on the host, and nothing ever built the artifact that ships.
  #
  # The `runtime` target specifically: `dev` would pass while the
  # production stage stayed broken, which is the failure mode worth
  # guarding.
  container-build:
    name: container build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          target: runtime
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # Alert rules are code. `promtool check` proves the PromQL parses;
  # `promtool test` proves it fires — and, for the failure-rate rule,
  # that a flood of refusals does not read as an outage. A rule naming a
  # metric nobody emits parses, loads, shows green, and can never fire,
  # so the metric-name cross-check lives in the worker test suite.
  alert-rules:
    name: alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate and unit-test the alert rules
        working-directory: infra/observability
        run: |
          docker run --rm -v "$PWD:/cfg:ro" -w /cfg \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check rules alerts.yml
          docker run --rm -v "$PWD:/cfg:ro" -w /cfg \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            test rules alerts.test.yml
      - name: Validate the Alertmanager routing
        working-directory: infra/observability
        run: |
          docker run --rm -v "$PWD:/cfg:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.1 \
            check-config /cfg/alertmanager.yml

  # Dependency-vulnerability scan (CLAUDE.md §10): pnpm's built-in audit
  # for the JS side, pip-audit for each Python service. Findings are
  # triaged, not ignored — this job is required, not advisory.
  dependency-audit:
    name: dependency audit / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [node, api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.target == 'node'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - if: matrix.target == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: matrix.target == 'node'
        run: pnpm install --frozen-lockfile
      - if: matrix.target == 'node'
        run: pnpm audit
      - if: matrix.target != 'node'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
      - if: matrix.target != 'node'
        working-directory: apps/${{ matrix.target }}
        run: uv sync --frozen
      - if: matrix.target != 'node'
        working-directory: apps/${{ matrix.target }}
        run: uvx pip-audit --local

  # Single required status check for branch protection, so adding a new
  # matrix leg later never silently drops out of what's enforced.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      [
        node-checks,
        python-checks,
        migration-reversibility,
        container-build,
        alert-rules,
        dependency-audit,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
