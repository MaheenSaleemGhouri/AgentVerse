name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly dependency-vulnerability sweep (CLAUDE.md §10: dependency
    # security checks run on every PR touching manifests *and* nightly).
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "9.15.9"
  NODE_VERSION: "22.23.1"
  UV_VERSION: "0.11.32"

jobs:
  # Cheapest-first ordering (CLAUDE.md §11): lint/type-check before test,
  # node and python tracks run in parallel since neither depends on the
  # other's output. python-checks now includes real-Postgres integration
  # tests (Phase 1) via the `postgres` service container below — CLAUDE.md
  # §11: "an integration test that mocks the database gives false
  # confidence."
  node-checks:
    name: node / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ["@agentverse/contracts", "@agentverse/web"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '${{ matrix.package }}' run lint
      - run: pnpm --filter '${{ matrix.package }}' run typecheck
      - run: pnpm --filter '${{ matrix.package }}' run build

  python-checks:
    name: python / apps/${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    # Present for both matrix legs (harmless, unused by worker — Phase 1
    # introduces no worker-owned schema) rather than conditioning the
    # service block itself, which GitHub Actions doesn't support per-matrix-value.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentverse
          POSTGRES_PASSWORD: agentverse_ci_only
          POSTGRES_DB: agentverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentverse -d agentverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTVERSE_API_DATABASE_URL: postgresql+asyncpg://agentverse:agentverse_ci_only@localhost:5432/agentverse
      # Both point at the same runner-local nothing-is-listening address —
      # fine for ruff/mypy/unit tests (nothing calls out) and for the
      # integration suite (get_current_identity is dependency-overridden,
      # never exercising a real JWKS fetch; see tests/auth_service/integration/test_rbac_routes.py).
      AGENTVERSE_API_AUTH_INTERNAL_URL: http://localhost:3000
      AGENTVERSE_API_AUTH_PUBLIC_URL: http://localhost:3000
      AGENTVERSE_API_INTERNAL_API_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.service }}/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - if: matrix.service == 'api'
        run: uv run alembic upgrade head
      - run: uv run pytest -q

  # Dependency-vulnerability scan (CLAUDE.md §10): pnpm's built-in audit
  # for the JS side, pip-audit for each Python service. Findings are
  # triaged, not ignored — this job is required, not advisory.
  dependency-audit:
    name: dependency audit / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [node, api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.target == 'node'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - if: matrix.target == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: matrix.target == 'node'
        run: pnpm install --frozen-lockfile
      - if: matrix.target == 'node'
        run: pnpm audit
      - if: matrix.target != 'node'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
      - if: matrix.target != 'node'
        working-directory: apps/${{ matrix.target }}
        run: uv sync --frozen
      - if: matrix.target != 'node'
        working-directory: apps/${{ matrix.target }}
        run: uvx pip-audit --local

  # Single required status check for branch protection, so adding a new
  # matrix leg later never silently drops out of what's enforced.
  ci-gate:
    name: CI gate
    if: always()
    needs: [node-checks, python-checks, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
