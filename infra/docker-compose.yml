# AgentVerse local development stack (Phase 1).
#
# Run from this directory: `cd infra && cp .env.example .env && docker compose up --build`
# (docker compose auto-loads `.env` from its own working directory —
# running from `infra/` is what makes `${POSTGRES_USER}` etc. resolve).
#
# apps/web and apps/api both require real config as of Phase 1 (Postgres
# credentials, Better Auth secrets) — unlike Phase 0's health-only
# stubs, these have no safe defaults, so `infra/.env` now supplies them
# via the `environment:` blocks below rather than each service falling
# back on its own.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentverse_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-agentverse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentverse} -d ${POSTGRES_DB:-agentverse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: dev
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      AGENTVERSE_API_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentverse}:${POSTGRES_PASSWORD:-agentverse_dev_only}@postgres:5432/${POSTGRES_DB:-agentverse}
      # Genuinely different values (see apps/api/.env.example for why):
      # internal = Docker-network hostname apps/api uses to fetch JWKS;
      # public = the browser-facing origin that ends up in JWT iss/aud.
      AGENTVERSE_API_AUTH_INTERNAL_URL: http://web:3000
      AGENTVERSE_API_AUTH_PUBLIC_URL: http://localhost:${WEB_PORT:-3000}
      AGENTVERSE_API_INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in infra/.env — see infra/.env.example}
      AGENTVERSE_API_OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in infra/.env — see infra/.env.example}
      # Phase 6: apps/api writes third-party MCP credentials, apps/worker
      # resolves them. Same key on both, or ciphertext written by one is
      # unreadable by the other.
      AGENTVERSE_CREDENTIAL_KEK_V1: ${AGENTVERSE_CREDENTIAL_KEK_V1:?Set AGENTVERSE_CREDENTIAL_KEK_V1 in infra/.env — see infra/.env.example}
      # Phase 3: producer side of apps/worker's job queue — same Redis
      # instance, container-network hostname (not the "localhost" default
      # that's only correct when running apps/api directly on the host).
      AGENTVERSE_API_REDIS_URL: redis://redis:6379/0
      # Phase 6 gap-closure: this service's own browser-reachable origin.
      # Every OAuth provider's redirect_uri points here, not at the
      # container-network hostname — the user's browser lands on this
      # callback directly, the same way it would on a Stripe webhook.
      AGENTVERSE_API_API_PUBLIC_URL: http://localhost:${API_PORT:-8000}
      # Each pair is optional (see apps/api/.env.example) — a provider
      # missing either half is simply absent from the OAuth registry,
      # not a button that fails on click.
      AGENTVERSE_API_NOTION_OAUTH_CLIENT_ID: ${NOTION_OAUTH_CLIENT_ID:-}
      AGENTVERSE_API_NOTION_OAUTH_CLIENT_SECRET: ${NOTION_OAUTH_CLIENT_SECRET:-}
      AGENTVERSE_API_LINEAR_OAUTH_CLIENT_ID: ${LINEAR_OAUTH_CLIENT_ID:-}
      AGENTVERSE_API_LINEAR_OAUTH_CLIENT_SECRET: ${LINEAR_OAUTH_CLIENT_SECRET:-}
      AGENTVERSE_API_JIRA_OAUTH_CLIENT_ID: ${JIRA_OAUTH_CLIENT_ID:-}
      AGENTVERSE_API_JIRA_OAUTH_CLIENT_SECRET: ${JIRA_OAUTH_CLIENT_SECRET:-}
      AGENTVERSE_API_HUBSPOT_OAUTH_CLIENT_ID: ${HUBSPOT_OAUTH_CLIENT_ID:-}
      AGENTVERSE_API_HUBSPOT_OAUTH_CLIENT_SECRET: ${HUBSPOT_OAUTH_CLIENT_SECRET:-}
      AGENTVERSE_API_CLOUDFLARE_OAUTH_CLIENT_ID: ${CLOUDFLARE_OAUTH_CLIENT_ID:-}
      AGENTVERSE_API_CLOUDFLARE_OAUTH_CLIENT_SECRET: ${CLOUDFLARE_OAUTH_CLIENT_SECRET:-}
    volumes:
      # Mirrors the in-image layout (see infra/docker/api.Dockerfile):
      # the shared package is resolved by relative path, so mounting the
      # service alone would shadow it out of existence.
      - ../apps/api:/src/apps/api
      - ../packages/python-shared:/src/packages/python-shared
      - api_venv_src:/src/apps/api/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
      target: dev
    ports:
      - "${WORKER_PORT:-8001}:8001"
    environment:
      # Phase 3: the queue this worker consumes — container-network
      # hostname, not the "localhost" default that's only correct when
      # running apps/worker directly on the host.
      AGENTVERSE_WORKER_REDIS_URL: redis://redis:6379/0
      # Phase 4: same Postgres schema apps/api owns (see
      # infrastructure/config.py's Settings.database_url docstring).
      AGENTVERSE_WORKER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentverse}:${POSTGRES_PASSWORD:-agentverse_dev_only}@postgres:5432/${POSTGRES_DB:-agentverse}
      AGENTVERSE_WORKER_OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in infra/.env — see infra/.env.example}
      # Phase 6: the SAME key apps/api uses. A credential sealed by one
      # service must be readable by the other, so this is deliberately
      # not service-prefixed. `:?` so a missing key fails compose up
      # rather than the first tool call (CLAUDE.md Rule 1).
      AGENTVERSE_CREDENTIAL_KEK_V1: ${AGENTVERSE_CREDENTIAL_KEK_V1:?Set AGENTVERSE_CREDENTIAL_KEK_V1 in infra/.env — see infra/.env.example}
    # Phase 3 (docs/roadmap.md acceptance criterion): a runaway job must
    # be killed by *this* container's own limit, not by starving the
    # host or co-located services. `mem_limit`/`cpus`/`pids_limit` are
    # plain `docker compose` keys (no swarm/`deploy:` block needed) and
    # are enforced by the kernel cgroup, independent of anything the
    # process inside does. Dev-scale values — retune from real p95
    # memory/CPU usage once Phase 4 adds actual agent-execution jobs.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    pids_limit: 200
    volumes:
      - ../apps/worker:/src/apps/worker
      # Shared with apps/api above: an edit to the shared package
      # hot-reloads both services, which is the point of it being shared.
      - ../packages/python-shared:/src/packages/python-shared
      - worker_venv_src:/src/apps/worker/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      target: dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentverse}:${POSTGRES_PASSWORD:-agentverse_dev_only}@postgres:5432/${POSTGRES_DB:-agentverse}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in infra/.env — see infra/.env.example}
      BETTER_AUTH_URL: http://localhost:${WEB_PORT:-3000}
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:${WEB_PORT:-3000}
      API_INTERNAL_URL: http://api:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in infra/.env — see infra/.env.example}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    # The whole repo is mounted (not just apps/web) because this is a
    # pnpm workspace: apps/web depends on packages/contracts by
    # workspace reference. node_modules at every level is shadowed by
    # a named volume so container-native installs are never clobbered
    # by the host's bind-mounted (and possibly different-platform)
    # node_modules.
    volumes:
      - ..:/repo
      - web_root_node_modules:/repo/node_modules
      - web_app_node_modules:/repo/apps/web/node_modules
      - contracts_node_modules:/repo/packages/contracts/node_modules
      - web_next_cache:/repo/apps/web/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Phase 6: scrapes the worker's `/internal/metrics` and evaluates the
  # alert rules. Local-stack only — staging and production run a managed
  # Prometheus rather than this container, but they load the *same* two
  # config files, so a rule that evaluates here evaluates there.
  #
  # No Alertmanager alongside it: receivers need real routing keys,
  # which do not belong in a checked-in file (Rule 1). Rules still
  # evaluate and are visible at http://localhost:9090/alerts, so a rule
  # can be verified locally without a pager attached.
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Local retention only. Production retention is a managed-service
      # setting, not this file's business.
      - --storage.tsdb.retention.time=15d
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  prometheus_data:
  # `_src` suffix marks the move from `/app/.venv` to
  # `/src/apps/<service>/.venv`. A venv records absolute paths in
  # `pyvenv.cfg` and in every console-script shebang, so the old volume
  # is not merely stale at the new mount point — it is broken, and the
  # symptom is `Failed to spawn: uvicorn` rather than anything that
  # points at the cause.
  #
  # Renaming rather than asking everyone to `docker volume rm` makes the
  # migration automatic: a fresh volume is created on next `up`. The old
  # ones are left orphaned rather than deleted — reclaiming them is
  # `docker volume prune`, which is the developer's call to make, not
  # this file's.
  api_venv_src:
  worker_venv_src:
  web_root_node_modules:
  web_app_node_modules:
  contracts_node_modules:
  web_next_cache:
