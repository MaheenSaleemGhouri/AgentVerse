# Alertmanager routing for the MCP tool-execution surface.
#
# ## No secret appears in this file, and none may
#
# Receivers read their credentials from `*_file` paths, not inline
# values (CLAUDE.md Rule 1: a secret's only legitimate homes are the
# secrets manager and the runtime environment). The files are mounted at
# runtime — a Docker secret locally, a mounted secret volume in
# staging/production. A missing file makes Alertmanager fail to start,
# which is the intended behaviour: an alerting stack that silently comes
# up unable to notify anyone is worse than one that refuses to start.
#
# Locally there is nothing to mount and nothing to page, so the compose
# stack runs Prometheus alone and rules are inspected at /alerts. This
# file is what a real deployment supplies the secrets to.

global:
  resolve_timeout: 5m

# Routing is by `severity` and `route`, which every rule in alerts.yml
# sets. A rule that forgets them lands in the catch-all receiver rather
# than being dropped — an unrouted page must still reach somebody.
route:
  receiver: platform-default
  group_by: [alertname, range]
  # Deliberately short for a surface whose P1s are single events. A
  # 5-minute group_wait would delay a credential-theft probe by five
  # minutes to batch it with nothing.
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers: [severity = "p1", route = "security-oncall"]
      receiver: security-pager
      group_wait: 0s
      # Every egress denial is its own notification. Grouping them would
      # collapse a probe sweeping many ranges into one alert, and the
      # spread across ranges is exactly the diagnostic signal.
      group_by: [alertname, range]
      repeat_interval: 1h

    - matchers: [severity = "p1"]
      receiver: platform-pager
      group_wait: 0s
      repeat_interval: 1h

    - matchers: [severity = "p2"]
      receiver: platform-tickets

    - matchers: [severity = "p3"]
      receiver: platform-tickets
      # P3s are next-working-day work. Re-notifying every four hours
      # trains people to ignore the channel that also carries P2s.
      repeat_interval: 24h

# An egress denial is not suppressed by anything. It is deliberately
# absent from the inhibition rules below: a degraded fleet is exactly
# when an attacker's probe is most likely to be missed.
inhibit_rules:
  # A server that is down produces failures; do not also raise the
  # attachment-failure ticket for the same window.
  - source_matchers: [alertname = "ToolFailureRateHigh"]
    target_matchers: [alertname = "McpAttachmentFailing"]
    equal: [instance]

receivers:
  - name: security-pager
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-security
        severity: critical
        description: "{{ .CommonAnnotations.summary }}"
        details:
          runbook: "{{ .CommonAnnotations.runbook }}"
          description: "{{ .CommonAnnotations.description }}"

  - name: platform-pager
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-platform
        severity: critical
        description: "{{ .CommonAnnotations.summary }}"
        details:
          runbook: "{{ .CommonAnnotations.runbook }}"
          description: "{{ .CommonAnnotations.description }}"

  - name: platform-tickets
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-platform
        channel: "#agentverse-alerts"
        title: "{{ .CommonLabels.severity | toUpper }} — {{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}\n\nRunbook: {{ .CommonAnnotations.runbook }}"

  # Catch-all. Reached only by a rule that failed to set severity/route,
  # which is a bug in the rule — so it goes to the same place a P2 does
  # rather than nowhere.
  - name: platform-default
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-platform
        channel: "#agentverse-alerts"
        title: "UNROUTED — {{ .CommonAnnotations.summary }}"
        text: "This alert set no severity/route matcher. Fix the rule in infra/observability/alerts.yml."
