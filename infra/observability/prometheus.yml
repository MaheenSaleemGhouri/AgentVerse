# Prometheus scrape configuration for AgentVerse.
#
# Two jobs, because the two services emit genuinely different signals
# and neither can report the other's.
#
# The **worker** emits the tool-execution surface: tool calls, egress
# validation, MCP attachment, credential unsealing. All of it happens
# there.
#
# **apps/api** emits the billing surface (Phase 9): webhook processing,
# quota refusals, payment-provider calls, credit-balance drift,
# transactional-email delivery. Billing runs in apps/api, and every one
# of those failures is otherwise silent — a webhook that failed
# processing produces no customer-visible symptom until an invoice is
# wrong.

global:
  # 15s against a 5m alert window gives ~20 samples per evaluation —
  # enough for `increase()` to be meaningful without paying for
  # per-second resolution nobody reads.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # Set per environment. Without it, a staging alert and a production
    # alert are indistinguishable in the notification.
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # Deliberately empty here. Receivers need real credentials
      # (PagerDuty routing key, Slack webhook) which do not belong in a
      # checked-in file (Rule 1) and differ per environment. The rules
      # in alerts.yml are complete and will evaluate; wiring them to a
      # pager is a deployment step, and `phase-6-go-no-go.md` names it
      # as a condition rather than assuming it.

scrape_configs:
  - job_name: agentverse-worker
    metrics_path: /internal/metrics
    static_configs:
      # One target per worker container. Metrics are per-process, so
      # every replica must be listed (or discovered) — scraping one of N
      # would undercount the fleet by roughly that factor, silently.
      - targets: ["worker:8001"]
        labels:
          service: agentverse-worker

  - job_name: agentverse-api
    metrics_path: /internal/metrics
    static_configs:
      # Same per-process caveat as the worker: metrics live in each
      # container's own registry, so every replica must be listed or
      # discovered. Scraping one of N undercounts the fleet by roughly
      # that factor, silently.
      - targets: ["api:8000"]
        labels:
          service: agentverse-api
